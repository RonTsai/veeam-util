    case "object": return `<path d="M10 34a8 8 0 0 1 0-16 11 11 0 0 1 21-3 9 9 0 0 1 1 19z" fill="${g}"/>
      <text x="20" y="30" text-anchor="middle" style="fill:#fff;font-size:8px;font-weight:700">S3</text>`;
    case "em": case "vone": return `<rect x="0" y="0" width="40" height="40" rx="4" fill="${kind === "em" ? "#1f8fd6" : "#4b555e"}"/>
      <rect x="7" y="8" width="26" height="18" rx="2" fill="none" stroke="#fff" stroke-width="2.4"/>
      <path d="M13 32h14M20 26v6" stroke="#fff" stroke-width="2.4"/>
      <text x="20" y="21" text-anchor="middle" style="fill:#fff;font-size:8px;font-weight:700">${kind === "em" ? "EM" : "ONE"}</text>`;
    case "agent": return `<rect x="4" y="0" width="30" height="40" rx="2" fill="#fff" stroke="${d}" stroke-width="2"/>
      <path d="M10 10h18M10 17h18M10 24h10M24 24h4M10 31h10M24 31h4" stroke="${d}" stroke-width="2.4"/>`;
    default: return `<rect x="0" y="12" width="40" height="16" rx="3" fill="${d}"/><path d="M6 20h20" stroke="#fff" stroke-width="2"/><circle cx="33" cy="20" r="2" fill="#fff"/>`;
  }
}

// vSphere clusters: ESXi hosts are grouped by cluster; a collapsed cluster is drawn as one card.
// Many hosts (over 12): all clusters start collapsed. Clicking a cluster title toggles it.
const clusterKey = n => n.cluster ? n.cluster.vcenter + "|" + n.cluster.name : null;
let collapsed = null;
// SOBRs opened to show their tiers: performance extents, capacity tier, archive tier
const openSobr = new Set();
const TIERS = [["extents", "Performance tier"], ["capacity", "Capacity tier"], ["archive", "Archive tier"]];
const hasTiers = n => n.kind === "sobr" && TIERS.some(([k]) => (n[k] || []).some(id => MODEL.nodes.some(x => x.id === id)));
// Hosts of a collapsed cluster -> the cluster card's id; the cluster cards themselves
let alias = {}, EXTRA = [];

function render() {
  const showInferred = document.getElementById("showInferred").checked;
  const showOther = document.getElementById("showOther").checked;
  const tierOf = {};
  MODEL.nodes.filter(n => openSobr.has(n.id)).forEach(sb => TIERS.forEach(([k, label]) =>
    (sb[k] || []).forEach(id => tierOf[id] ??= { sobr: sb.id, tier: label })));
  let nodes = MODEL.nodes.filter(n => !n.inSobr || tierOf[n.id]);
  nodes.forEach(n => { n.tierOf = tierOf[n.id]; n.w = n.tierOf ? W - 16 : W; });

  if (collapsed == null) collapsed = new Set(MODEL.nodes.filter(n => n.cluster).length > 12 ? MODEL.nodes.map(clusterKey).filter(Boolean) : []);
  const clusters = {};
  nodes.forEach(n => { const k = clusterKey(n); if (k) (clusters[k] ??= []).push(n); });
  const vcCount = new Set(Object.values(clusters).map(hs => hs[0].cluster.vcenter)).size;
  alias = {}; EXTRA = [];
  Object.entries(clusters).forEach(([k, hs]) => {
    if (!collapsed.has(k)) return;
    const id = "cluster:" + k;
    hs.forEach(h => alias[h.id] = id);
    EXTRA.push({ id, kind: "vi_host", name: hs[0].cluster.name, sub: `vSphere cluster · ${hs.length} host${hs.length > 1 ? "s" : ""}`, cluster: hs[0].cluster,
      isCluster: true, badges: [], w: W, placeLabel: t("clusterExpand"),
      details: { vCenter: hs[0].cluster.vcenter, Hosts: hs.map(h => h.name).join(", ") } });
  });
  nodes = nodes.filter(n => !alias[n.id]).concat(EXTRA);
  const byId = Object.fromEntries(nodes.map(n => [n.id, n]));
  // Links to hosts of a collapsed cluster go to the cluster card (merged, jobs combined)
  const merged = {};
  MODEL.links.forEach(l0 => {
    const l = { ...l0, source: alias[l0.source] || l0.source, target: alias[l0.target] || l0.target };
    const k = l.source + "|" + l.target + "|" + l.kind;
    if (l.source === l.target) return;
    if (merged[k]) merged[k].jobs = [...new Set([...merged[k].jobs, ...l.jobs])]; else merged[k] = l;
  });
  const links = Object.values(merged).filter(l => byId[l.source] && byId[l.target] && (showInferred || l.kind !== "inferred"));
  // Column order: vCenter first, then each cluster, then standalone hosts; an open SOBR keeps its tiers under it
  const groupKey = n => n.kind !== "vi_host" || !Object.keys(clusters).length ? ""
    : n.cluster ? "1" + n.cluster.name.toLowerCase() + "|" + n.cluster.vcenter : /^ESXi|^Source host/.test(n.sub) ? "2" : "0";
  const regroup = arr => {
    arr.sort((a, b) => groupKey(a).localeCompare(groupKey(b)));
    openSobr.forEach(id => {
      const kids = arr.filter(n => n.tierOf?.sobr === id);
      const at = arr.findIndex(n => n.id === id);
      if (!kids.length || at < 0) return;
      const tierIx = n => TIERS.findIndex(([, label]) => label === n.tierOf.tier);
      kids.sort((a, b) => tierIx(a) - tierIx(b));
      arr = arr.filter(n => !kids.includes(n));
      arr.splice(arr.findIndex(n => n.id === id) + 1, 0, ...kids);
    });
    return arr;
  };

  // --- columns
  const cols = COLS.map(c => ({ ...c, nodes: nodes.filter(n => c.kinds.includes(n.kind)) })).filter(c => c.nodes.length);
  cols.forEach((c, i) => c.nodes.forEach((n, k) => { n.col = i; n.row = k; }));
  // Order nodes by the rows they link to, to reduce crossings
  const order = {}; nodes.forEach(n => order[n.id] = n.row ?? 0);
  for (let pass = 0; pass < 3; pass++) cols.forEach(c => {
    const score = n => { const ys = links.filter(l => l.source === n.id || l.target === n.id)
      .map(l => order[l.source === n.id ? l.target : l.source]); return ys.length ? ys.reduce((a,b)=>a+b)/ys.length : order[n.id]; };
    c.nodes.sort((a, b) => score(a) - score(b) || a.name.localeCompare(b.name));
    c.nodes = regroup(c.nodes);
    c.nodes.forEach((n, k) => { n.row = k; order[n.id] = k; });
  });

  // --- route classification
  const nC = cols.length, gapLinks = Array.from({ length: nC + 1 }, () => []);
  const lanes = [];
  links.forEach(l => {
    const s = byId[l.source], t = byId[l.target];
    if (t.col === s.col + 1) { l.route = "adj"; gapLinks[t.col].push([l, "a"]); }
    else if (t.col === s.col) { l.route = "same"; gapLinks[s.col + 1].push([l, "a"]); }
    else { l.route = "lane"; gapLinks[s.col + 1].push([l, "a"]); gapLinks[t.col].push([l, "b"]); lanes.push(l); }
  });
  const gapW = gapLinks.map((g, i) => (i === 0 ? 60 : i === nC ? 40 : 80) + 13 * g.length);
  let x = gapW[0];
  cols.forEach((c, i) => { c.x = x; x += W + gapW[i + 1]; });
  const nMgmt = MODEL.nodes.filter(n => n.kind === "em" || n.kind === "vone").length;
  const totalW = Math.max(x, 900, gapW[0] + 80 + (nMgmt + 1) * (W + 50));
  // Rows; a cluster or an open SOBR is framed, with room for the cluster title and the tier labels
  const frames = [], tierLabels = [];
  const frameOf = n => n.cluster ? "cl:" + clusterKey(n) : n.tierOf ? "sb:" + n.tierOf.sobr : openSobr.has(n.id) && hasTiers(n) ? "sb:" + n.id : "";
  cols.forEach(c => {
    let y = COL_TOP, prev = null, fr = null;
    c.nodes.forEach(n => {
      const g = frameOf(n), pg = prev ? frameOf(prev) : "";
      if (prev) y = prev.y + H + (n.tierOf && g === pg ? 12 : VGAP);
      if (prev && g !== pg && fr) { fr.y2 = prev.y + H + 10; frames.push(fr); fr = null; y += 14; }
      if (g && g !== pg) { fr = { key: g, node: n, x: c.x - 8, y1: y }; y += g.startsWith("cl:") ? 30 : 10; }
      if (n.tierOf && (!prev || prev.tierOf?.tier !== n.tierOf.tier || prev.tierOf?.sobr !== n.tierOf.sobr)) {
        tierLabels.push({ x: c.x + 16, y: y + 9, text: n.tierOf.tier }); y += 18;
      }
      n.x = c.x + (n.tierOf ? 16 : 0); n.y = y;
      prev = n;
    });
    if (fr) { fr.y2 = prev.y + H + 10; frames.push(fr); }
  });
  const maxBottom = Math.max(COL_TOP + H, ...nodes.filter(n => n.col != null).map(n => n.y + H), ...frames.map(f => f.y2));

  // channel x within each gap
  gapLinks.forEach((g, i) => {
    const left = i === 0 ? 14 : cols[i - 1].x + W + 14;
    const right = i === nC ? totalW - 14 : cols[i].x - 30;
    g.sort((a, b) => byId[a[0].target].y - byId[b[0].target].y);
    g.forEach(([l, which], k) => {
      const cx = left + (right - left) * (k + 1) / (g.length + 1);
      if (which === "a") l.c1 = cx; else l.c2 = cx;
    });
  });
  lanes.sort((a, b) => byId[b.source].col - byId[a.source].col);
  lanes.forEach((l, k) => l.laneY = maxBottom + 34 + k * 14);
  const lanesBottom = lanes.length ? maxBottom + 34 + lanes.length * 14 : maxBottom;

  // ports: outgoing on right edge; incoming on left (or right for same-column)
  const ports = {};
  const addPort = (id, side, l, end) => (ports[id + side] ??= []).push([l, end]);
  links.forEach(l => { addPort(l.source, "R", l, "s"); addPort(l.target, l.route === "same" ? "R" : "L", l, "t"); });
  Object.entries(ports).forEach(([key, arr]) => {
    const n = byId[key.slice(0, -1)];
    arr.sort((a, b) => { const o = e => byId[e[1] === "s" ? e[0].target : e[0].source].y; return o(a) - o(b); });
    arr.forEach(([l, end], k) => { const y = n.y + 14 + (H - 28) * (k + 1) / (arr.length + 1); if (end === "s") l.sy = y; else l.ty = y; });
  });

  // other servers
  const others = showOther ? MODEL.nodes.filter(n => n.kind === "server") : [];
  const perRow = Math.max(1, Math.floor((totalW - 60) / (W + 20)));
  const otherTop = lanesBottom + 70;
  others.forEach((n, k) => { n.x = 40 + (k % perRow) * (W + 20); n.y = otherTop + Math.floor(k / perRow) * (H + 20); });
  const legendY = (others.length ? otherTop + Math.ceil(others.length / perRow) * (H + 20) : lanesBottom + 30) + 20;
  const totalH = legendY + 40;

  // backup server
  const vbr = MODEL.nodes.find(n => n.kind === "backup");
  MODEL.nodes.forEach(n => n.w ??= W);
  vbr.x = (cols[0]?.x ?? 60) + 40; vbr.y = 28;
  const mgmt = MODEL.nodes.filter(n => n.kind === "em" || n.kind === "vone");
  mgmt.forEach((n, i) => { n.x = vbr.x + (i + 1) * (W + 50); n.y = 28; });

  // --- draw
  let s = `<style>${SVG_STYLE}</style><rect width="${totalW}" height="${totalH}" fill="#fff"/>`;
  s += `<line class="bus" x1="20" y1="${BUS_Y}" x2="${totalW - 20}" y2="${BUS_Y}"/>`;
  s += `<path class="mgmt" d="M${vbr.x + 30} ${vbr.y + H} V${BUS_Y}"/><circle class="dot" cx="${vbr.x + 30}" cy="${BUS_Y}" r="5"/>`;
  cols.forEach(c => {
    const sx = c.x - 14, last = c.nodes[c.nodes.length - 1];
    s += `<text class="gtitle" x="${c.x}" y="${BUS_Y + 28}">${esc(c.title.toUpperCase())} · ${c.nodes.length}</text>`;
    s += `<path class="mgmt" d="M${sx} ${BUS_Y} V${last.y + H / 2}"/><circle class="dot" cx="${sx}" cy="${BUS_Y}" r="5"/>`;
    c.nodes.forEach(n => s += `<path class="mgmt" d="M${sx} ${n.y + H / 2} H${n.x}"/>`);
  });

  frames.forEach(f => {
    s += `<rect class="frame${f.key.startsWith("sb:") ? " sobr" : ""}" x="${f.x}" y="${f.y1}" width="${W + 16}" height="${f.y2 - f.y1}" rx="10"/>`;
    if (!f.key.startsWith("cl:")) return;
    const k = clusterKey(f.node), c = f.node.cluster, open = !collapsed.has(k);
    const label = c.name + (vcCount > 1 ? ` (${c.vcenter.split(".")[0]})` : "") + (open ? " · " + (clusters[k].length > 1 ? t("nHosts", { n: clusters[k].length }) : t("nHost")) : "");
    s += `<text class="ftitle" data-cl="${esc(k)}" x="${f.x + 12}" y="${f.y1 + 19}">${open ? "▾" : "▸"} ${esc(trunc(label, 30))}</text>`;
  });
  tierLabels.forEach(l => s += `<text class="tierLbl" x="${l.x}" y="${l.y}">${esc(l.text.toUpperCase())}</text>`);

  links.forEach((l, i) => {
    const a = byId[l.source], b = byId[l.target];
    const sx = a.x + a.w, tx = l.route === "same" ? b.x + b.w + 2 : b.x - 2;
    let d;
    if (l.route === "adj" || l.route === "same") d = `M${sx} ${l.sy} H${l.c1} V${l.ty} H${tx}`;
    else d = `M${sx} ${l.sy} H${l.c1} V${l.laneY} H${l.c2} V${l.ty} H${tx}`;
    const tip = `${esc(a.name)} → ${esc(b.name)}` + (l.jobs.length ? "\n" + l.jobs.map(esc).join("\n") : "") +
                (l.kind === "inferred" ? "\n" + t("tipInferred") : l.kind === "auto" ? "\n" + t("tipAuto") : "");
    s += `<g class="link" data-s="${esc(l.source)}" data-t="${esc(l.target)}" data-jobs="${esc(JSON.stringify(l.jobs))}"><title>${tip}</title>
      <path class="flow ${l.kind}" d="${d}" marker-end="url(#arr-${l.kind})"/><path class="hit" d="${d}"/></g>`;
  });

  const place = (n, w) => {
    // Object storage gateways: the first one (short name) and how many more; the full list is in the hover details
    // In Direct connection mode the data does not go through the gateways: the chip says Direct
    const gws = n.kind === "object" && n.details?.Gateway ? String(n.details.Gateway).split(/,\s*/) : [];
    const gw1 = gws.length > 1 && !/^\d+\.\d+\.\d+\.\d+$/.test(gws[0]) ? gws[0].split(".")[0] : gws[0];
    const direct = n.kind === "object" && /^direct$/i.test(n.details?.["Connection mode"] || "");
    const chip = n.placeLabel || (direct ? t("directMode") : gws.length ? `Gateway: ${gw1}${gws.length > 1 ? ` +${gws.length - 1}` : ""}` : null);
    if (chip) return `<rect class="placeChip" x="56" y="45" width="${w - 66}" height="16" rx="4"/>
      <text class="place" x="62" y="57">${esc(trunc(td(chip), Math.round(30 * (w - 66) / (W - 66))))}</text>`;
    if (!n.placement) return "";
    const p = n.placement, unk = !p.host;
    const label = unk ? t("unknownHost") : `${p.platform === "hv" ? "Hyper-V" : "ESXi"}: ${p.host}`;
    return `<rect class="placeChip${unk ? " unknown" : ""}" x="56" y="45" width="${w - 66}" height="16" rx="4"/>
      <text class="place${unk ? " unknown" : ""}" x="62" y="57">${esc(trunc(label, Math.round(30 * (w - 66) / (W - 66))))}</text>`;
  };
  const drawNode = n => {
    const w = n.w || W;
    const usage = n.usage != null ? `<rect x="58" y="${H - 11}" width="${w - 72}" height="4" rx="2" fill="#e6eaec"/>
      <rect x="58" y="${H - 11}" width="${(w - 72) * Math.min(1, n.usage)}" height="4" rx="2" fill="${n.usage > .85 ? "#e0533d" : "#00b336"}"/>` : "";
    const badges = (n.badges || []).map((b, k) => `<circle class="badge" cx="${w - 6 - k * 26}" cy="0" r="12"/>
      <text class="badgeT" x="${w - 6 - k * 26}" y="4.5" text-anchor="middle">${esc(b)}</text>`).join("");
    const toggle = hasTiers(n) ? `<text class="more" x="${w - 10}" y="${H - 6}" text-anchor="end">${esc(t(openSobr.has(n.id) ? "hideTiers" : "showTiers"))}</text>` : "";
    return `<g class="node${n.isCluster || hasTiers(n) ? " click" : ""}" data-id="${esc(n.id)}" transform="translate(${n.x},${n.y})">
      <rect class="card" width="${w}" height="${H}" rx="8"/>
      <g transform="translate(10,${(H - 40) / 2})">${icon(n.kind, n.sub)}</g>
      <text class="name" x="58" y="${HAS_PLACE ? 22 : 27}">${esc(trunc(n.name, 21))}</text>
      <text class="sub" x="58" y="${HAS_PLACE ? 38 : 44}">${esc(trunc(td(n.sub), 27))}</text>${place(n, w)}${usage}${badges}${toggle}</g>`;
  };
  s += drawNode(vbr);
  mgmt.forEach(n => s += `<path class="mgmt" d="M${n.x + 30} ${n.y + H} V${BUS_Y}"/><circle class="dot" cx="${n.x + 30}" cy="${BUS_Y}" r="5"/>` + drawNode(n));
  nodes.filter(n => n.col != null).forEach(n => s += drawNode(n));
  if (others.length) {
    s += `<text class="gtitle" x="40" y="${otherTop - 16}">${esc(t("otherTitle"))} · ${others.length}</text>`;
    others.forEach(n => s += drawNode(n));
  }

  // legend
  const lg = [["data", t("legendData")], ["auto", t("legendAuto")], ["copy", t("legendCopy")], ["inferred", t("legendInferred")]];
  let lx = 0, lgs = "";
  lg.forEach(([k, label]) => { lgs += `<path class="flow ${k}" d="M${lx} 0 h40" marker-end="url(#arr-${k})"/><text x="${lx + 50}" y="4">${esc(label)}</text>`;
    lx += 80 + textW(label); });
  lx += 30;
  s += `<g class="legend" transform="translate(40,${legendY})">${lgs}
     <circle class="badge" cx="${lx + 10}" cy="0" r="10"/><text class="badgeT" x="${lx + 10}" y="4" text-anchor="middle">M</text>
     <text x="${lx + 26}" y="4">Veeam Data Mover Service</text>
     <circle class="badge" cx="${lx + 230}" cy="0" r="10"/><text class="badgeT" x="${lx + 230}" y="4" text-anchor="middle">A</text>
     <text x="${lx + 246}" y="4">Veeam Agent</text></g>`;

  const marker = (id, c) => `<marker id="arr-${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="${c}"/></marker>`;
  s = `<defs>${marker("data", "#00b336")}${marker("auto", "#7fd99a")}${marker("copy", "#1f8fd6")}${marker("inferred", "#9aa5ae")}</defs>` + s;

  const svg = document.getElementById("diagram");
  svg.setAttribute("width", totalW); svg.setAttribute("height", totalH);
  svg.setAttribute("viewBox", `0 0 ${totalW} ${totalH}`);
  svg.innerHTML = s;
  wireHover(svg);
  highlightSelJob();
  updateShade();
}

// Shade the side(s) of the diagram with more to scroll to: overlay scrollbars (macOS, Windows 11)
// stay hidden until you scroll, so a first-time viewer would not know the diagram is wider
function updateShade() {
  const c = document.querySelector(".canvas"), max = c.scrollWidth - c.clientWidth;
  c.parentElement.classList.toggle("more-left", c.scrollLeft > 1);
  c.parentElement.classList.toggle("more-right", c.scrollLeft < max - 1);
}
document.querySelector(".canvas").addEventListener("scroll", updateShade, { passive: true });
window.addEventListener("resize", updateShade);

function wireHover(svg) {
  const tip = document.getElementById("tip");
  const all = Object.fromEntries([...MODEL.nodes, ...EXTRA].map(n => [n.id, n]));
  svg.querySelectorAll(".ftitle").forEach(x => x.addEventListener("click", () => {
    const k = x.dataset.cl; collapsed.has(k) ? collapsed.delete(k) : collapsed.add(k); render(); }));
  svg.querySelectorAll(".node").forEach(g => {
    const n = all[g.dataset.id];
    g.addEventListener("mouseenter", () => {
      const rel = new Set([n.id]);
      svg.querySelectorAll(".link").forEach(l => {
        const on = l.dataset.s === n.id || l.dataset.t === n.id;
        l.classList.toggle("dim", !on); if (on) { rel.add(l.dataset.s); rel.add(l.dataset.t); }
      });
      // Placement: hovering a component lights up its ESXi host; hovering a host lights up everything on it
      MODEL.nodes.forEach(o => { if (o.runsOn === n.id || alias[o.runsOn] === n.id) rel.add(o.id); });
      if (n.runsOn) rel.add(n.runsOn);
      svg.querySelectorAll(".node").forEach(o => o.classList.toggle("dim", !rel.has(o.dataset.id)));
      const rows = Object.entries(n.details || {}).filter(([k]) => !k.startsWith("_"))
        .map(([k, v]) => `<tr><td>${esc(td(k))}</td><td>${esc(td(v))}</td></tr>`).join("");
      const hosted = MODEL.nodes.filter(o => o.runsOn === n.id || alias[o.runsOn] === n.id);
      const hostedRow = hosted.length ? `<tr><td>${esc(t("hosted"))}</td><td>${hosted.map(o => esc(o.name)).join("<br>")}</td></tr>` : "";
      tip.innerHTML = `<b>${esc(n.name)}</b><br>${esc(td(n.sub))}<table>${rows}${hostedRow}</table>`;
      tip.style.display = "block";
    });
    g.addEventListener("click", () => {
      if (n.isCluster) { collapsed.delete(clusterKey(n)); render(); }
      else if (hasTiers(n)) { openSobr.has(n.id) ? openSobr.delete(n.id) : openSobr.add(n.id); render(); }
    });
    g.addEventListener("mousemove", e => { tip.style.left = Math.min(e.clientX + 14, innerWidth - 380) + "px"; tip.style.top = e.clientY + 14 + "px"; });
    g.addEventListener("mouseleave", () => { tip.style.display = "none"; highlightSelJob(); });
  });
}

function tables() {
  const order = ["backup", "em", "vone", "vi_host", "ext_host", "hv_host", "agent", "proxy", "repo", "sobr", "object", "server"];
  const ns = [...MODEL.nodes].sort((a, b) => order.indexOf(a.kind) - order.indexOf(b.kind) || a.name.localeCompare(b.name));
  const th = keys => "<tr>" + keys.map(k => `<th>${esc(t(k))}</th>`).join("") + "</tr>";
  document.getElementById("invTable").innerHTML = th(["thKind", "thName", "thRole", "thDetails"]) +
    ns.map(n => `<tr><td>${esc(kindLabel(n.kind))}</td><td>${esc(n.name)}</td><td>${esc(td(n.sub))}</td><td>${
      Object.entries(n.details || {}).filter(([k]) => !k.startsWith("_")).map(([k, v]) => `${esc(td(k))}: ${esc(td(v))}`).join("<br>")}</td></tr>`).join("");
  const placed = MODEL.nodes.filter(n => n.placement);
  if (placed.length) {
    document.getElementById("placeSection").style.display = "";
    const groups = {};
    placed.forEach(n => (groups[n.placement.host || "—"] ??= []).push(n));
    const keys = Object.keys(groups).sort((a, b) => (a === "—") - (b === "—") || a.localeCompare(b));
    document.getElementById("placeTable").innerHTML = th(["thHost", "thComponent", "thRoleShort", "thVm", "thMatched"]) +
      keys.map(h => groups[h].map((n, i) => `<tr>${i === 0 ? `<td rowspan="${groups[h].length}"><b>${esc(h === "—" ? t("unknownGroup") : h)}</b></td>` : ""}
        <td>${esc(n.name)}</td><td>${esc(kindLabel(n.kind))}</td><td>${esc(n.placement.vm || "")}</td>
        <td>${esc(td(n.placement.source || n.placement.note || ""))}</td></tr>`).join("")).join("");
  }
  // Jobs with protected objects expand on click (see toggleJob)
  // Size on disk in bytes -> GB / TB
  const fmtBytes = v => v == null ? "—" : v >= 1024 ** 4 ? (v / 1024 ** 4).toFixed(1) + " TB" : (v / 1024 ** 3).toFixed(1) + " GB";
  // Cells a collector cannot fill (j.unavailable: field -> note code) show "n/a" with a footnote number
  const noteNums = [];
  const na = (j, f, text) => {
    const code = (j.unavailable || {})[f];
    if (!code) return esc(text);
    if (!noteNums.includes(code)) noteNums.push(code);
    return `<span class="na">${esc(t("notAvailable"))}<sup>${noteNums.indexOf(code) + 1}</sup></span>`;
  };
  document.getElementById("jobTable").innerHTML = th(["thJob", "thType", "thSource", "thProxy", "thRepo", "thRetention", "thEncryption", "thLastRun", "thLastResult", "thState"]) +
    (MODEL.jobs || []).map((j, i) => {
      const objs = j.objects || [], has = objs.length > 0;
      const row = `<tr class="job${has ? " has" : ""}" data-i="${i}"><td><span class="caret">${has ? "▸" : ""}</span>${esc(j.name)}${
        // count included objects only, as the console's Objects column: File / Tag masks are filters and a
        // SureBackup virtual lab is where the job runs, not objects
        has ? `<span class="count">(${objs.filter(o => !o.excluded && !/ mask$|^Virtual lab$/.test(o.type)).length})</span>` : ""}</td><td>${esc(j.type)}</td>
        <td>${na(j, "sources", (j.sources || []).join(", "))}</td><td>${esc(j.proxies)}</td><td>${esc(j.repository)}</td>
        <td class="nowrap">${na(j, "retention", j.retention ? td(j.retention) : "—")}</td><td>${na(j, "encrypted", j.encrypted == null ? "—" : t(j.encrypted ? "yes" : "no"))}</td>
        <td class="nowrap">${na(j, "lastRun", j.lastRun ?? "—")}</td><td class="result ${esc((j.lastResult || "").toLowerCase())}">${na(j, "lastResult", j.lastResult ?? "—")}</td>
        <td>${na(j, "disabled", j.disabled == null ? "—" : t(j.disabled ? "disabled" : "enabled"))}</td></tr>`;
      const sub = has ? `<tr class="objs" data-for="${i}" hidden><td colspan="10"><table>${
        th(["objType", "objName", "objLocation", "objSize", "objMode"])}${objs.map(o => `<tr class="${o.excluded ? "ex" : ""}">
        <td>${esc(td(o.type))}</td><td>${esc(o.name)}</td><td>${esc(o.location)}</td><td>${esc(o.size)}</td>
        <td>${esc(t(o.excluded ? "objExclude" : "objInclude"))}</td></tr>`).join("")}</table></td></tr>` : "";
      return row + sub;
    }).join("");
  document.getElementById("jobNotes").innerHTML = noteNums.length ?
    `${esc(t("jobNotesTitle"))}<ol>${noteNums.map(c => `<li>${esc(t("note_" + c))}</li>`).join("")}</ol>` : "";
  document.querySelectorAll("#jobTable tr.job.has").forEach(tr => tr.onclick = () => toggleJob(tr));
  showSelJob();
  // Backups, as the VBR console's Backups view lists them; each expands to its VMs
  const bks = MODEL.backups || [];
  document.getElementById("backupSection").style.display = bks.length ? "" : "none";
  document.getElementById("backupTable").innerHTML = th(["thBackup", "thJob", "thRepo", "thPlatform", "thCreated", "thPoints", "thLast", "thDisk"]) +
    bks.map((b, i) => {
      const objs = b.objects || [], has = objs.length > 0, open = openBackups.has(i);
      return `<tr class="job${has ? " has" : ""}${open ? " open" : ""}" data-i="${i}"><td><span class="caret">${has ? (open ? "▾" : "▸") : ""}</span>${esc(b.name)}${
        has ? `<span class="count">(${objs.length})</span>` : ""}</td><td>${esc(b.job ?? "—")}</td><td>${esc(b.repository ?? "—")}</td><td>${esc(b.platform ?? "—")}</td>
        <td class="nowrap">${esc(b.created ?? "—")}</td><td class="num">${esc(b.restorePoints ?? "—")}</td><td class="nowrap">${esc(b.lastBackup ?? "—")}</td>
        <td class="num">${esc(fmtBytes(b.onDisk))}</td></tr>` + (has ? `<tr class="objs" data-for="${i}"${open ? "" : " hidden"}><td colspan="8"><table>${
        th(["thVm", "thPoints", "thLast", "thDisk"])}${objs.map(o => `<tr><td>${esc(o.name)}</td><td class="num">${esc(o.restorePoints ?? "—")}</td>
        <td class="nowrap">${esc(o.lastBackup ?? "—")}</td><td class="num">${esc(fmtBytes(o.onDisk))}</td></tr>`).join("")}</table></td></tr>` : "");
    }).join("");
  document.querySelectorAll("#backupTable tr.job.has").forEach(tr => tr.onclick = () => {
    const i = +tr.dataset.i, on = !openBackups.has(i);
    on ? openBackups.add(i) : openBackups.delete(i);
    tr.classList.toggle("open", on); tr.querySelector(".caret").textContent = on ? "▾" : "▸";
    document.querySelector(`#backupTable tr.objs[data-for="${i}"]`).hidden = !on;
  });
}
// Expanded rows of the Backups table (several at a time; kept across re-renders)
const openBackups = new Set();

// The expanded job (index into MODEL.jobs), or null. One job at a time; it survives re-renders,
// and node hovers fall back to its highlight when the mouse leaves.
let selJob = null;

function toggleJob(tr) {
  selJob = selJob === +tr.dataset.i ? null : +tr.dataset.i;
  showSelJob();
}

// Expand the selected job's objects in the table and highlight its links in the diagram
function showSelJob() {
  document.querySelectorAll("#jobTable tr.job.has").forEach(x => {
    const on = +x.dataset.i === selJob;
    x.classList.toggle("open", on); x.querySelector(".caret").textContent = on ? "▾" : "▸";
    document.querySelector(`#jobTable tr.objs[data-for="${x.dataset.i}"]`).hidden = !on;
  });
  highlightSelJob();
}

function highlightSelJob() {
  const svg = document.getElementById("diagram");
  svg.querySelectorAll(".dim").forEach(x => x.classList.remove("dim"));
  if (selJob == null) return;
  // Link labels are the job name, plus " (disabled)" for disabled jobs
  const name = MODEL.jobs[selJob].name, ends = new Set();
  svg.querySelectorAll(".link").forEach(l => {
    const on = JSON.parse(l.dataset.jobs).some(x => x === name || x.startsWith(name + " ("));
    l.classList.toggle("dim", !on); if (on) { ends.add(l.dataset.s); ends.add(l.dataset.t); }
  });
  if (ends.size) svg.querySelectorAll(".node").forEach(n => n.classList.toggle("dim", !ends.has(n.dataset.id)));
}

function download(name, blob) { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click(); }
const svgText = () => new XMLSerializer().serializeToString(document.getElementById("diagram"));
document.getElementById("dlSvg").onclick = () => download("vbr-topology.svg", new Blob([svgText()], { type: "image/svg+xml" }));
document.getElementById("dlJson").onclick = () => download("topology.json", new Blob([JSON.stringify(MODEL, null, 2)], { type: "application/json" }));
document.getElementById("dlPng").onclick = () => {
  const svg = document.getElementById("diagram"), img = new Image(), k = 2;
  img.onload = () => { const c = document.createElement("canvas"); c.width = svg.width.baseVal.value * k; c.height = svg.height.baseVal.value * k;
    const ctx = c.getContext("2d"); ctx.scale(k, k); ctx.drawImage(img, 0, 0); c.toBlob(b => download("vbr-topology.png", b)); };
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svgText());
};
["showInferred", "showOther"].forEach(id => document.getElementById(id).onchange = render);

function renderAll() {
  document.documentElement.lang = LANG === "zh" ? "zh-Hant" : "en";
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
  document.getElementById("langBtn").textContent = t("langBtn");
  const v = MODEL.vbr || {};
  document.title = t("pageTitle") + (v.name ? " · " + v.name.split(".")[0] : "");
  document.getElementById("meta").textContent = t("meta",
    { name: v.name || "?", build: v.build || "?", api: v.apiVersion || "?", time: v.collectedAt || MODEL.generatedAt });
  document.getElementById("warnings").innerHTML = MODEL.warnings?.length
    ? `<div class="warn">⚠ ${MODEL.warnings.map(w => esc(td(w))).join("<br>⚠ ")}</div>` : "";
  render(); tables();
}
document.getElementById("langBtn").onclick = () => {
  LANG = LANG === "zh" ? "en" : "zh";
  try { localStorage.setItem("vbrTopoLang", LANG); } catch (e) { }
  renderAll();
};
renderAll();
</script>
</body>
</html>
